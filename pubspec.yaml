name: margadarshak
description: "Mārgadarshak — a career decision system for Indian students and parents, Class 9 to post-graduation."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.2
  # google_fonts removed deliberately: it fetched Space Grotesk and Inter over
  # the network at runtime, which silently failed in release builds (no
  # INTERNET permission) and fell back to Roboto. Both families are now
  # bundled as assets. Do not re-add it.
  intl: ^0.20.2
  riverpod_annotation: ^4.0.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Test-only: lets widget tests back LocalPersistence with an in-memory
  # store instead of the platform channel.
  shared_preferences_platform_interface: ^2.4.1

flutter:
  uses-material-design: true

  # Fonts are bundled, not fetched. The app makes no network calls at all —
  # a student on patchy mobile data sees the real design system on first
  # launch, and the privacy policy's "no data leaves the device" stays true.
  # Licences: assets/fonts/OFL-Inter.txt, assets/fonts/OFL-SpaceGrotesk.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
