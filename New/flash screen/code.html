<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Margadarshak - Splash</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {

                        "surface-variant": "#e8e3da",
                        "surface-dim": "#d6d1c9",
                        "error-container": "#ffdad6",
                        "surface-container": "#eee9e0",

                        "background": "#f5f0e8",

                        "on-tertiary-fixed": "#1a1a1a",
                        "secondary-fixed-dim": "#ffb3ab",
                        "on-error": "#ffffff",
                        "secondary": "#e63b2e",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed": "#1a1a1a",
                        "on-primary-fixed": "#1a1a1a",
                        "on-secondary-fixed-variant": "#1a1a1a",
                        "outline": "#1a1a1a",
                        "inverse-surface": "#1a1a1a",
                        "inverse-on-surface": "#f5f0e8",
                        "on-tertiary-container": "#1a1a1a",
                        "tertiary-fixed-dim": "#a8c6ff",
                        "on-secondary-container": "#1a1a1a",
                        "secondary-container": "#ffdad6",
                        "on-surface": "#1a1a1a",
                        "surface-container-highest": "#e2ddd4",
                        "on-primary-fixed-variant": "#1a1a1a",
                        "on-error-container": "#93000a",
                        "on-primary-container": "#1a1a1a",
                        "surface-container-high": "#e8e3da",
                        "surface-container-low": "#f2ede5",
                        "surface-container-lowest": "#ffffff",
                        "error": "#cc0000",
                        "tertiary-fixed": "#d6e3ff",
                        "primary-fixed-dim": "#e6b800",
                        "primary": "#1a1a1a",
                        "outline-variant": "#d0cbc3",
                        "on-surface-variant": "#4a4a4a",
                        "on-background": "#1a1a1a",
                        "tertiary-container": "#d6e3ff",
                        "surface": "#f5f0e8",
                        "on-tertiary": "#ffffff",
                        "surface-tint": "#1a1a1a",
                        "secondary-fixed": "#ffdad6",
                        "primary-fixed": "#ffcc00",
                        "on-secondary": "#1a1a1a",
                        "tertiary": "#0055ff",
                        "on-tertiary-fixed-variant": "#1a1a1a",

                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"

                    "fontFamily": {
                        "headline": ["Space Grotesk", "sans-serif"],
                        "display": ["Space Grotesk", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Space Grotesk", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface min-h-screen flex flex-col justify-center items-center relative overflow-hidden font-body selection:bg-outline selection:text-primary-container">
<!-- Architectural Grid Lines -->
<div class="absolute inset-0 pointer-events-none opacity-10">
<div class="absolute left-1/4 top-0 bottom-0 w-px bg-outline"></div>
<div class="absolute left-3/4 top-0 bottom-0 w-px bg-outline"></div>
<div class="absolute top-1/4 left-0 right-0 h-px bg-outline"></div>
<div class="absolute top-3/4 left-0 right-0 h-px bg-outline"></div>
</div>
<!-- Bauhaus Geometry Decor Floating -->
<div class="absolute top-8 left-4 md:left-12 w-24 h-24 md:w-40 md:h-40 bg-secondary rounded-full border-4 border-outline shadow-[8px_8px_0px_0px_#1a1a1a] pointer-events-none"></div>
<div class="absolute -top-12 right-12 md:right-32 w-32 h-32 md:w-48 md:h-48 bg-primary-container border-4 border-outline pointer-events-none shadow-[8px_8px_0px_0px_#1a1a1a] rotate-12 z-0"></div>
<div class="absolute bottom-12 right-4 md:right-16 w-48 h-32 md:w-72 md:h-48 bg-tertiary border-4 border-outline shadow-[12px_12px_0px_0px_#1a1a1a] pointer-events-none"></div>
<div class="absolute bottom-24 left-8 md:left-24 w-16 h-16 md:w-24 md:h-24 bg-surface-dim border-4 border-outline pointer-events-none transform -rotate-12 shadow-[6px_6px_0px_0px_#1a1a1a]"></div>
<div class="absolute top-1/2 left-0 w-12 h-32 bg-primary-container border-y-4 border-r-4 border-outline shadow-[6px_6px_0px_0px_#1a1a1a] pointer-events-none hidden md:block"></div>
<!-- Main Splash Content Container -->
<main class="relative z-10 flex flex-col items-center justify-center w-full px-4 max-w-7xl mx-auto">
<!-- Bauhaus Content Card -->
<div class="bg-surface border-4 border-outline p-6 md:p-12 shadow-[16px_16px_0px_0px_#1a1a1a] md:shadow-[24px_24px_0px_0px_#1a1a1a] flex flex-col items-start w-full max-w-4xl relative">
<!-- Decorative Card Elements Overlapping -->
<div class="absolute -top-6 -left-6 w-12 h-12 bg-tertiary border-4 border-outline shadow-[4px_4px_0px_0px_#1a1a1a]"></div>
<div class="absolute -bottom-6 -right-6 w-12 h-12 bg-secondary border-4 border-outline rounded-full shadow-[4px_4px_0px_0px_#1a1a1a]"></div>
<div class="absolute -right-8 top-1/4 w-16 h-4 bg-primary-container border-4 border-outline shadow-[4px_4px_0px_0px_#1a1a1a]"></div>
<div class="w-full flex justify-between items-center mb-8">
<div class="flex gap-2">
<div class="w-3 h-3 bg-secondary border-2 border-outline rounded-full"></div>
<div class="w-3 h-3 bg-primary-container border-2 border-outline rounded-full"></div>
<div class="w-3 h-3 bg-tertiary border-2 border-outline rounded-full"></div>
</div>
<span class="font-headline font-bold text-outline text-sm tracking-widest uppercase border-b-2 border-outline pb-0.5">V_1.0</span>
</div>
<h1 class="font-headline text-[3.5rem] leading-[0.85] tracking-tighter sm:text-7xl md:text-8xl lg:text-[8rem] font-black text-outline uppercase break-words w-full">
                MARGA<br/>DARSHAK
            </h1>
<div class="w-full flex flex-col sm:flex-row items-start sm:items-center mt-10 md:mt-16 gap-6">
<div class="h-4 w-20 md:w-32 bg-primary-container border-4 border-outline shrink-0 shadow-[4px_4px_0px_0px_#1a1a1a]"></div>
<p class="font-body text-lg sm:text-xl md:text-3xl font-bold text-outline uppercase tracking-widest leading-snug max-w-md">
                    Your path to a purposeful career.
                </p>
</div>
</div>
</main>
